<html>
    <head>
        <title>Create an Agent | GeorgeAI</title>
        <link rel="stylesheet" href="css/bg.css">
        <style>
            body {
                font-family: sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                color: white; /* Added for visibility */
            }
            input, textarea {
                font-family: sans-serif;
                width: min(500px, 80%);
                border: none;
                border-radius: 20px;
                padding: 15px;
                background-color: #212121;
                color: white;
                margin-bottom: 15px;
            }
            textarea {
                resize: none;
                height: 200px;
            }
            /* Styling for the file input and button */
            .file-label {
                margin-bottom: 10px;
                font-size: 0.9em;
                opacity: 0.8;
            }
            button {
                width: min(530px, 86%);
                padding: 15px;
                border-radius: 20px;
                border: none;
                background-color: #212121;
                color: white;
                font-weight: bold;
                cursor: pointer;
            }
            button:hover { background-color: #313131; }
        </style>
    </head>
    <body>
        <h1>Create an Agent</h1>
        
        <div class="file-label">Agent Name:</div>
        <input type="text" id="agentName" placeholder="Name">
        <div class="file-label">System Instructions:</div>
        <textarea id="agentInstructions" placeholder="System Instructions"></textarea>
        
        <div class="file-label">Upload Profile Icon:</div>
        <input type="file" id="imageInput" accept="image/*">
        
        <button onclick="createAndRedirect()">Create Agent</button>

        <script>
function createAndRedirect() {
    const name = document.getElementById('agentName').value.trim();
    const instructions = document.getElementById('agentInstructions').value.trim();
    const fileInput = document.getElementById('imageInput');
    const file = fileInput.files[0];

    const params = new URLSearchParams();
    
    // Add text fields only if they aren't empty
    if (name) params.append('name', name);
    if (instructions) params.append('instructions', instructions);

    const targetUrl = "/";

    // If there's a file, process it; otherwise, just redirect
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const size = 40;
                canvas.width = size;
                canvas.height = size;

                let sX = 0, sY = 0, sSize = Math.min(img.width, img.height);
                sX = (img.width - sSize) / 2;
                sY = (img.height - sSize) / 2;

                ctx.drawImage(img, sX, sY, sSize, sSize, 0, 0, size, size);
                
                // Add the icon to params
                params.append('icon', canvas.toDataURL('image/jpeg', 0.8));
                
                // Final Redirect with Icon
                window.location.href = `${targetUrl}?${params.toString()}`;
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    } else {
        // Final Redirect without Icon
        window.location.href = `${targetUrl}?${params.toString()}`;
    }
}

        </script>
    </body>
</html>
