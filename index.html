<html>
    <head>
        <title>GeorgeAI</title>
        <link rel="stylesheet" href="css/input.css">
        <link rel="stylesheet" href="css/chat.css">
        <link rel="stylesheet" href="css/bg.css">
        <link rel="stylesheet" href="css/markdown.css">
        <link rel="stylesheet" href="css/share.css">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/marked@17.0.3/lib/marked.umd.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked-highlight@2.2.3/lib/index.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    </head>
    <body>    
        <header>
            <button id="new">+</button>
            <button id="share">&#xe80d;</button>
            <a href="/createAgent.html" style="justify-self: flex-start; color: white;" id="ownagent">Create Agent</a>
            <h1>GeorgeAI</h1><p style="margin-left: 5px; margin-bottom: 1px;">by Ethan</p>
        </header>
        <div class="chat-box">
        </div>
        <div class="talk">
            <input type="text" class="thearea" placeholder="talk to george here">
            <button class="send">&#xe163;</button>
        </div>

        <!-- Share Modal -->
        <div id="shareModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Share Chat</h2>
                <div class="share-options">
                    <div class="share-option">
                        <label>Share Link:</label>
                        <div class="share-link-container">
                            <input type="text" id="shareLink" readonly class="share-input">
                            <button id="copyShareLink" class="copy-btn">Copy Link</button>
                        </div>
                    </div>
                    <div class="share-option qr-section">
                        <label>Scan to Share (Mobile):</label>
                        <div id="qrCode" class="qr-code-container"></div>
                    </div>
                    <div class="share-option">
                        <label>Export as JSON:</label>
                        <button id="exportChat" class="export-btn">Download</button>
                    </div>
                    <div class="share-option">
                        <label>Save Chat:</label>
                        <input type="text" id="chatName" placeholder="Enter chat name..." class="chat-name-input">
                        <button id="saveChat" class="save-btn">Save</button>
                    </div>
                    <div class="share-option">
                        <label>Your Saved Chats:</label>
                        <select id="savedChats" class="saved-chats-select">
                            <option value="">-- No saved chats --</option>
                        </select>
                        <button id="loadChat" class="load-btn">Load</button>
                        <button id="deleteChat" class="delete-btn">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="alertAgent" class="alert-agent"></div>
        <div id="confirmModal" class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
            <div class="confirm-modal__content">
                <h2 id="confirmTitle">Confirm action</h2>
                <p id="confirmMessage">Are you sure?</p>
                <div class="confirm-modal__actions">
                    <button id="confirmCancel" class="confirm-btn cancel">Cancel</button>
                    <button id="confirmAccept" class="confirm-btn accept">Confirm</button>
                </div>
            </div>
        </div>

        <script src="js/index.js"></script>
    </body>
</html>
